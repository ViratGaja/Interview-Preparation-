<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Todo</h1>
    <input type="text" class="data" name="" id="">
    <button class="Btn">Click</button>
    
    <ul class="ul">

    </ul>


    <script>
        var ul=document.querySelector('ul')
        var dataInput=document.querySelector('.data')
        var editingSpan=null

        document.querySelector(".Btn").addEventListener("click",function(){
            var value=dataInput.value.trim();
            if(!value) return;

            if(editingSpan){
                editingSpan.textContent=value;
                editingSpan=null;
            } else {
                var li=document.createElement('li');
                var span=document.createElement('span');
                span.textContent=value;

                var edit=document.createElement('button');
                edit.textContent="Edit";
                edit.onclick=function(){
                    dataInput.value=span.textContent;
                    editingSpan=span;
                }

                var remove=document.createElement('button');
                remove.textContent="Delete";
                
                remove.addEventListener("click",function(){
                    li.remove()
                })

                li.append(span, edit, remove);
                ul.appendChild(li);
            }

            dataInput.value="";
        })
    </script>

</body>
</html>
