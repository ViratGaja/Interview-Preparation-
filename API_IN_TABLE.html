<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid;
            padding: 20px;

        }

        th,
        td {
            padding: 20px;
            border: 1px solid;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>





    <script>
        var tbody = document.getElementById("tbody");

        fetch("https://jsonplaceholder.typicode.com/posts")
            .then((a) => a.json())
            .then((a) => {
                a.forEach((b) => {

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                                <td>${b.id}</td>
                                <td>${b.title}</td>
                                <td>${b.body}</td>
                                
                                `;
                    tbody.appendChild(tr)
                })


            })
            .catch((er) => {
                console.log(er)
            })




    </script>



</body>

</html>
